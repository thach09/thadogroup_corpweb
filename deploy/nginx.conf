pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $asset_cache {
        default "no-cache";
        ~^/_astro/ "public, max-age=31536000, immutable";
    }
    map $status $cache_control {
        default "no-store";
        200 $asset_cache;
        304 $asset_cache;
    }
    server {
        listen 8080;
        server_name _;
        root /srv/site/current;
        index index.html;
        autoindex off;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control $cache_control always;
        # HTTP loopback staging. Add HSTS only at the verified HTTPS edge.
        error_page 404 /404.html;
        location = /_headers { return 404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}

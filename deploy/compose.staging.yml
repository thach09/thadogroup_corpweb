# Template only. Requires owner approval before starting on the server.
services:
  web:
    image: ${THADO_NGINX_IMAGE:?Set an approved nginx image pinned by digest}
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    ports: ["127.0.0.1:8090:8080"]
    volumes:
      - ${THADO_SITE_ROOT:?Set a dedicated absolute site root}:/srv/site:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
